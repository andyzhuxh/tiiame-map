<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TIIAME 校园地图</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1>TIIAME 校园地图</h1>
    <p class="hint" id="hint">点一栋楼看介绍，再点第二栋楼看步行路线</p>
  </header>

  <div class="map-wrap">
    <div id="map" aria-label="校园地图"></div>
    <div class="view-tools" role="group" aria-label="视角">
      <button type="button" data-view="left" title="向左转 45°">↺ 左转</button>
      <button type="button" data-view="right" title="向右转 45°">↻ 右转</button>
      <button type="button" data-view="north" title="上方朝北">朝北</button>
      <button type="button" data-view="tilt" id="tilt" title="平面 / 立体">3D</button>
      <button type="button" data-view="official" title="和官方校园图相同的视角">官方图视角</button>
    </div>
  </div>

  <section class="sheet" id="sheet">
    <div class="quick" id="quick" aria-label="常用路线"></div>
    <div class="route" id="route" hidden></div>
    <div class="cards" id="cards"></div>
    <button class="clear" id="clear" type="button" hidden>重新选择</button>
  </section>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
